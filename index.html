<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visitas — Casa en Venta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-text">
        <span class="header-eyebrow">Agenda tu visita</span>
        <h1 class="header-title">Residencia en Venta</h1>
        <p class="header-sub">Selecciona un día disponible para agendar tu cita de visita.</p>
      </div>
      <div class="header-address">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="property-address">Av. Ejemplo 123, San José</span>
      </div>
    </div>
  </header>

  <!-- PANTALLA DE CARGA -->
  <div class="loading-screen" id="loading-screen">
    <div class="loading-spinner"></div>
    <p>Conectando…</p>
  </div>

  <!-- CALENDARIO -->
  <main class="main-content" id="main-content" style="display:none">
    <section class="calendar-section">
      <div class="calendar-nav">
        <button class="nav-btn" id="prev-month" aria-label="Mes anterior">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h2 class="calendar-month-title" id="month-title"></h2>
        <button class="nav-btn" id="next-month" aria-label="Mes siguiente">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <div class="legend">
        <span class="legend-item"><span class="legend-dot available"></span>Disponible</span>
        <span class="legend-item"><span class="legend-dot partial"></span>Parcial</span>
        <span class="legend-item"><span class="legend-dot full"></span>Completo</span>
        <span class="legend-item"><span class="legend-dot past"></span>Pasado / No disponible</span>
      </div>

      <div class="calendar-weekdays">
        <span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span>
        <span>Jue</span><span>Vie</span><span>Sáb</span>
      </div>

      <div class="calendar-grid" id="calendar-grid"></div>
    </section>
  </main>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-date-title" hidden>
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <div class="modal-header">
        <span class="modal-eyebrow">Agendar visita</span>
        <h3 class="modal-date-title" id="modal-date-title"></h3>
      </div>
      <p class="modal-instruction">Elige un horario disponible:</p>
      <div class="time-slots" id="time-slots"></div>

      <div class="confirm-form" id="confirm-form" hidden>
        <div class="form-divider"></div>
        <p class="form-label">Horario seleccionado: <strong id="selected-time-display"></strong></p>
        <div class="form-group">
          <label for="visitor-name">Tu nombre</label>
          <input type="text" id="visitor-name" placeholder="Ej. María García" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="visitor-phone">Teléfono / WhatsApp</label>
          <input type="tel" id="visitor-phone" placeholder="Ej. +506 8888-8888" autocomplete="tel" />
        </div>
        <button class="btn-confirm" id="btn-confirm">Confirmar cita</button>
        <button class="btn-cancel-selection" id="btn-cancel-selection">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <!-- Firebase v9 (compat mode — funciona sin bundler) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
